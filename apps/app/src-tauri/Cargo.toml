[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }          # Async runtime
rusqlite = { version = "0.35", features = ["bundled"] } # SQLite database
automerge = "0.6"                                       # CRDT implementation
chrono = "0.4"                                          # Date and time
thiserror = "2.0"                                       # Error handling helper
directories = "6.0"                                     # Cross-platform directory handling
# Potentially add crates for networking later (e.g., reqwest, tokio-tungstenite)
